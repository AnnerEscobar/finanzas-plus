<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="w-full max-w-md">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Finanzas+</h1>
      <p class="text-gray-600">Gestión Financiera Personal</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-lg shadow-xl p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Iniciar Sesión</h2>

      <!-- Error Message -->
      <div *ngIf="error" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-800 text-sm">{{ error }}</p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="login()" class="space-y-4">
        <!-- User ID Input -->
        <div>
          <label for="userId" class="block text-sm font-medium text-gray-700 mb-1">
            ID de Usuario
          </label>
          <input
            id="userId"
            type="text"
            [(ngModel)]="userId"
            name="userId"
            placeholder="Ingrese su ID de usuario"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
            [disabled]="loading"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center"
        >
          <svg
            *ngIf="loading"
            class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          {{ loading ? 'Cargando...' : 'Entrar' }}
        </button>
      </form>

      <!-- Info Text -->
      <p class="text-center text-gray-600 text-sm mt-6">
        Ingrese su ID de usuario para acceder al sistema
      </p>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-600 text-xs mt-6">
      © 2026 Finanzas+ | Gestión Deuda Cero
    </p>
  </div>
</div>
